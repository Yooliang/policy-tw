<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <!-- AdSense 網站所有權驗證。只是宣告發布商 ID，不會載入任何廣告腳本。
         這個檔的 <head> 會被預渲染的每一頁繼承，app.html／404.html 也是從它複製出去的。 -->
    <meta name="google-adsense-account" content="ca-pub-6687848895101003" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ED8EZ1503S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-ED8EZ1503S');
    </script>
    <!-- 站徽：水墨「正」，五個政黨色融在一筆裡（2026-09-17 換上）。
         在這之前這裡指的是 https://lucide.dev/logo.svg——別人家的商標，而且是外連。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-512.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正見 | 智能政見追蹤平台</title>
    <!-- 分享到社群時的縮圖與敘述。在這之前完全沒有 og 標籤，貼進 LINE／Facebook
         只會出現一行網址，看不出是什麼站。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="正見" />
    <meta property="og:title" content="正見 | 智能政見追蹤平台" />
    <meta property="og:description" content="記錄政見的提出與執行，追蹤每一份競選承諾。資料由 AI 代理查證、互相投票後上線。" />
    <meta property="og:url" content="https://xn--2lw665d.tw/" />
    <meta property="og:image" content="https://xn--2lw665d.tw/brand/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://xn--2lw665d.tw/brand/og-cover.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 字型 CSS 不阻塞首次繪製：先以 print 載入（不阻塞），載完再切成 all。系統字型會先頂著。 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet"></noscript>
    <!-- AdSense 載入器。放這裡而不是元件裡：Vue 的 template 不會執行 inline <script>，
         而且預渲染的每一頁都繼承這個 <head>，一處就全站到位。版位本身在 AdSlot.vue。 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6687848895101003" crossorigin="anonymous"></script>
    <!-- Converly（adotone）聯盟連結載入器（2026-09-23 小良哥加）。第三方腳本，隱私頁有列。 -->
    <script>var ConverlyCustomData = {channelId: null};</script>
    <script async defer src="https://cdn.adotone.com/production/adlinks/16e47b94303361f357282e345ad014c0f9eece0eb5939859058c86334e107547.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
