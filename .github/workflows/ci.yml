# 這個專案在 2026-09-12 之前沒有任何 CI，所有檢查都靠人在本機跑。
# 當天實際出過的事：一個開發代理回報「型別檢查全綠」，主線接手重跑是紅的。
# 所以這裡守的是「有人說他跑過了」以外的證據。
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # main 不取消：取消會讓 Hosting 一直部署不出去（2026-09-22 連續 11 次），排隊只會多等一輪；PR 分支照舊取消
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: 型別檢查與建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vue-tsc 單獨跑一次：建置也會跑它，但分開跑才看得出紅燈是型別還是打包
      - name: vue-tsc
        run: pnpm exec vue-tsc --noEmit
      # 預渲染一萬六千頁很慢，只在 main 上跑；分支上先擋住型別錯誤就夠了
      - name: 建置（含預渲染）
        if: github.ref == 'refs/heads/main'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build

  edge-tests:
    name: Edge Function 與協議守門測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # 這批測試包含 SQL 與 TypeScript 門檻矩陣的一致性、以及對外協議 skill.md
      # 的表格與版本號是否跟著改。門檻只改一邊就會在這裡紅。
      - name: deno test（supabase/functions/_shared）
        working-directory: supabase/functions
        run: deno test --allow-read _shared/
      - name: deno test（前端純函式）
        run: deno test --allow-read lib/policy-date.test.ts lib/retry.test.ts lib/activity.test.ts lib/url.test.ts lib/policy-visibility.test.ts lib/issue-tags.test.ts

      # 解開 JWT 看裡面的 role，只擋 anon 以外的那幾把。
      # 這個專案的 anon key 是刻意公開的，抓長相會讓這道燈變成狼來了然後被關掉。
      - name: 掃不該進版控的金鑰
        run: deno run --allow-read scripts/scan-secrets.ts

  # 部署只在 main、而且要等上面兩個 job 都綠。
  # 2026-09-13 之前沒有這一段：每次上線都是有人在自己機器上跑 firebase deploy，
  # 當天就出過事——我從落後的分支建置後直接推上去，把另一個人剛加的 GA 和政見
  # 詳情頁修法從線上洗掉了。CI 部署的重點不是省事，是「上線的東西一定跟 main 一樣」。
  #
  # 服務帳戶是 `firebase init hosting:github` 建的 github-action-1143883858，
  # 只有 Hosting admin 權限，不是整個專案的 Editor。
  deploy:
    name: 部署到 Firebase Hosting
    needs: [typecheck, edge-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 這裡要自己再建一次：typecheck job 的 dist 不會跨 job 傳過來，
      # 而且預渲染需要 Supabase 的環境變數。
      - name: 建置（含預渲染）
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POLICY_TW }}
          channelId: live
          projectId: policy-tw

  # 邊緣 SSR Worker（docs/PLAN-edge-ssr.md）：人物頁／政見頁在 Cloudflare 現場渲染，其餘代理到 web.app。
  # 排在 Firebase 之後：SSR 用的殼（app.html）與 assets 從 web.app 拿，要同一個 commit 的。
  # 沒有 CLOUDFLARE_API_TOKEN 就略過（本機可用 pnpm deploy:ssr）。
  ssr-deploy:
    name: 部署邊緣 SSR Worker（正見.tw）
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 建置 SSR bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build:ssr
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "沒有 CLOUDFLARE_API_TOKEN，略過 Worker 部署"; exit 0; fi
          npx wrangler deploy

