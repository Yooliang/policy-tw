# 這個專案在 2026-09-12 之前沒有任何 CI，所有檢查都靠人在本機跑。
# 當天實際出過的事：一個開發代理回報「型別檢查全綠」，主線接手重跑是紅的。
# 所以這裡守的是「有人說他跑過了」以外的證據。
name: CI

on:
  # 分支只靠 pull_request 跑一次（2026-10-13）：以前 push 到任何分支也跑，開了 PR 的分支每次推都跑兩遍一模一樣的 CI
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # main 不取消：取消會讓 Hosting 一直部署不出去（2026-09-22 連續 11 次），排隊只會多等一輪；PR 分支照舊取消
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 依改動路徑決定 main push 要不要跑完整後端測試與 Supabase 部署（2026-10-19 維護者）。
  # 只改前端的提交，8 組後端測試白跑 5 分鐘以上。分類規則與理由在 scripts/ci-changed-paths.mjs 檔頭；
  # PR 一律 backend=true（PR 上的 CI 不變，仍跑完整測試）。
  # 基準給兩個：上次成功部署函式的 tag（連續合併被略過的後端提交、上次部署失敗的後端改動都會算進來）與這次 push 的 before；
  # 任一個算不出差異（第一次 push 的 0000、force push、tag 不存在）就當後端類。
  changes:
    name: 判斷改動路徑
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: classify
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "不是 push 到 main：照舊跑完整測試。"
            exit 0
          fi
          DEPLOYED=$(git rev-parse -q --verify refs/tags/edge-functions-deployed || true)
          node scripts/ci-changed-paths.mjs "$DEPLOYED" "${{ github.event.before }}" "${{ github.sha }}"

  typecheck:
    name: 型別檢查與建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vue-tsc 單獨跑一次：建置也會跑它，但分開跑才看得出紅燈是型別還是打包
      - name: vue-tsc
        run: pnpm exec vue-tsc --noEmit
      # 預渲染只在 main 上跑；分支上先擋住型別錯誤就夠了。
      # 2026-09-24 起政治人物頁、政見頁改由 Worker 邊緣渲染，預渲染剩二十頁左右（約 1 分鐘）。
      - name: 建置（含預渲染）
        if: github.ref == 'refs/heads/main'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build
      # 建一次就好（2026-09-24 維護者）：部署 job 直接拿這份，不再自己重建一次
      - name: 保留建置結果給部署用
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          include-hidden-files: false

  edge-tests:
    name: Edge Function 與協議守門測試（${{ matrix.shard }}/8）
    needs: [changes]
    # main push 只改前端類路徑時略過（改由下面 frontend-tests 跑前端純函式與「會讀前端檔」的守門測試）
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # 拆成八台同時跑（2026-10-13）：_shared/ 有 95 個測試檔各自在 PGlite 重放 migration，排成一條要 20 分鐘以上。
    # 分法是「檔名排序後輪流發牌」，不用 deno 的 --shard：後者把排序後的檔案切成連續幾塊，
    # 檔名開頭相同的 policy-jp-* 重放整包 migration 的測試全擠進同一片（實測 12.5 分鐘 vs 其他片 0.5～3 分鐘）。
    # needs: [edge-tests] 會等八台全綠
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # 這批測試包含 SQL 與 TypeScript 門檻矩陣的一致性、以及對外協議 skill.md
      # 的表格與版本號是否跟著改。門檻只改一邊就會在這裡紅。
      - name: deno test（supabase/functions/_shared）
        working-directory: supabase/functions
        run: deno test --allow-read $(find _shared/ -name '*test.ts' | LC_ALL=C sort | awk 'NR % 8 == ${{ matrix.shard }} % 8')

  # 前端純函式測試與金鑰掃描：每次都跑（PR、前端類 push、後端類 push），以前掛在 edge-tests 第 1 片，
  # 前端類 push 略過 edge-tests 時它們不能跟著消失。
  # 前端類 push 另外跑「會讀前端檔的後端守門測試」清單（_shared/frontend-guard-tests.txt）：
  # 它們掃 pages/、components/、lib/ 等的原始碼（例如 Queue.vue 的顏色表、前端不得讀舊欄位），前端檔一改就可能紅。
  # 後端類 push 與 PR 已經由 edge-tests 跑全部 310 支，這裡不重跑。清單由 ci-path-filter.test.ts 守著不漏。
  frontend-tests:
    name: 前端測試與守門
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # 整個資料夾交給 deno 自己找 *.test.ts（2026-10-07 起）：以前手寫 36 個檔名，新測試漏加就是「測試存在但沒跑」
      # （ci-test-glob.test.ts 守這一行不再列檔名）
      - name: deno test（前端純函式）
        # Deno 2.x 新版預設「發佈未滿 24 小時的 npm 套件不裝」，--node-modules-dir=auto 每次現解析，
        # rollup 新版的平台選用套件剛發佈就讓這一步整批紅（2026-10-10）。這一步只跑純函式測試、不碰任何金鑰，
        # 關掉年齡限制換 CI 不被上游發版卡住；建置與部署仍走 pnpm-lock 鎖定的版本。
        run: deno test --allow-read --node-modules-dir=auto --minimum-dependency-age=0 lib/ cloudflare/

      # 解開 JWT 看裡面的 role，只擋 anon 以外的那幾把。
      # 這個專案的 anon key 是刻意公開的，抓長相會讓這道燈變成狼來了然後被關掉。
      - name: 掃不該進版控的金鑰
        run: deno run --allow-read scripts/scan-secrets.ts

      - name: deno test（會讀前端檔的守門測試，只在前端類 push）
        if: needs.changes.outputs.backend != 'true'
        working-directory: supabase/functions
        # 清單一行一支：「路徑」整支跑；「路徑 /正規式/」只跑名稱符合的那幾個測試（整支有 PGlite 重放要數分鐘，
        # 其中只有一兩個測試讀前端檔，ci-path-filter.test.ts 驗證正規式涵蓋了所有讀前端檔的測試）
        run: |
          set -eo pipefail
          deno test --allow-read $(grep -v ' ' _shared/frontend-guard-tests.txt | tr '\n' ' ')
          # 篩選沒符合任何測試時 deno 也回 0（0 passed），所以要自己檢查：測試改名後篩選落空＝守門悄悄沒跑
          grep ' ' _shared/frontend-guard-tests.txt | while read -r f flt; do
            NO_COLOR=1 deno test --allow-read --filter "$flt" "$f" 2>&1 | tee /tmp/guard-filter.log
            if grep -q ' 0 passed' /tmp/guard-filter.log; then echo "::error::篩選 $flt 沒有符合 $f 的任何測試"; exit 1; fi
          done

  # 部署只在 main、而且要等測試都綠：型別檢查與建置、前端測試一定要綠；後端類 push 另外要 edge-tests 綠。
  # 前端類 push 的 edge-tests 是「略過」（skipped），所以不能用預設的 needs 成功判斷（略過會連帶略過部署），
  # 也不能寫成「略過也算過」（那樣後端類 push 的 edge-tests 被取消或略過會放行）：
  # 條件明寫成「後端類 → edge-tests 必須 success；前端類 → 不需要」，always() 讓略過的上游不連坐。
  # 測試失敗（failure／cancelled）在兩條路徑上都擋部署。
  # 2026-09-13 之前沒有這一段：每次上線都是有人在自己機器上跑 firebase deploy，
  # 當天就出過事——我從落後的分支建置後直接推上去，把另一個人剛加的 GA 和政見
  # 詳情頁修法從線上洗掉了。CI 部署的重點不是省事，是「上線的東西一定跟 main 一樣」。
  #
  # 服務帳戶是 `firebase init hosting:github` 建的 github-action-1143883858，
  # 只有 Hosting admin 權限，不是整個專案的 Editor。
  deploy:
    name: 部署到 Firebase Hosting
    needs: [changes, typecheck, edge-tests, frontend-tests]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.changes.result == 'success' && needs.typecheck.result == 'success' &&
      needs.frontend-tests.result == 'success' &&
      (needs.changes.outputs.backend != 'true' || needs.edge-tests.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 用 typecheck job 建好的那份（同一個 commit、同一次建置），不再重建
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POLICY_TW }}
          channelId: live
          projectId: policy-tw

  # 邊緣 SSR Worker（docs/PLAN-edge-ssr.md）：人物頁／政見頁在 Cloudflare 現場渲染，其餘代理到 web.app。
  # 排在 Firebase 之後：SSR 用的殼（app.html）與 assets 從 web.app 拿，要同一個 commit 的。
  # 沒有 CLOUDFLARE_API_TOKEN 就略過（本機可用 pnpm deploy:ssr）。
  ssr-deploy:
    name: 部署邊緣 SSR Worker（正見.tw）
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 建置 SSR bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build:ssr
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "沒有 CLOUDFLARE_API_TOKEN，略過 Worker 部署"; exit 0; fi
          npx wrangler deploy
      # api.hustings.net（兩站協議端點與正見唯讀 REST 的固定網址，cloudflare/api-worker.js）。以前只能本機手動部署，
      # 改成跟 SSR Worker 一起自動上；密鑰 HUSTINGS_PROXY_SECRET 是 wrangler secret，部署不會動到它。
      # 只換程式、不碰路由：CI 的權杖沒有 hustings.net zone 的 Workers Routes 權限（#631 合併後 `wrangler deploy` 在改路由那步 403），
      # 所以用 versions upload＋versions deploy（不呼叫路由 API）。路由與 custom domain 要改時，照 api-wrangler.toml 檔頭在本機 wrangler deploy。
      - name: wrangler 換程式（api.hustings.net，不動路由）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "沒有 CLOUDFLARE_API_TOKEN，略過 Worker 部署"; exit 0; fi
          set -o pipefail
          npx wrangler versions upload -c cloudflare/api-wrangler.toml 2>&1 | tee /tmp/api-upload.log
          vid=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' /tmp/api-upload.log | awk '{print $4}' | tail -1)
          if [ -z "$vid" ]; then echo "抓不到 Worker Version ID"; exit 1; fi
          npx wrangler versions deploy "$vid@100%" --yes -c cloudflare/api-wrangler.toml

  # Hosting 綠了才部署 Supabase（migrations 先、Edge Functions 後）——順序理由見
  # scripts/deploy-functions.mjs 檔頭：函式先上線、公開的 skill.md 還沒更新的話，
  # 照協議讀 skill.md 版號校對的代理會卡在「重讀→還是不一樣→再重讀」的無限迴圈。
  # needs: [deploy] 已經保證這一點，不用再靠 scripts/deploy-functions.mjs 去現場
  # 抓線上 skill.md 版本比對（那支腳本原本是為了「人手動跑、可能忘記順序」寫的
  # 保險絲，這裡 CI 用 job 相依性機械保證順序，但仍然呼叫同一支腳本部署，等於多一層
  # 版本斷言，不衝突)。
  #
  # 2026-09-21 之前這一步全靠人記得手動跑 `pnpm deploy:functions`。同一天出過兩次事：
  # CI 綠、Hosting 也部署了，但沒人手動跑這步——線上前端已經是新的、端點卻還是舊的，
  # 兩個各自在跑任務的代理各自獨立測到「線上沒擋」。這裡改成機械化，不再靠人記得。
  # 守門如果需要人記得去啟動，它就不是守門，是文件——這條就是這次要堵的洞。
  #
  # 退版（rollback）順序跟部署順序相反：**函式先退，db 後退（如果真的要退 db）**。
  # 舊函式碰到新 schema 通常沒事（多出來的欄位／函式不影響舊程式碼路徑）；新函式碰到
  # 被退回的舊 schema 才會炸——像 20260921000018 那種用 CREATE OR REPLACE 換掉一個
  # SQL 函式的行為、新版 index.ts 依賴新行為的情況。而且 `supabase db push` 沒有自動
  # 反向操作，退 migration 要手動寫一個新的「反向」migration 再 push，不是單純
  # revert 這個 commit 就會自動處理。真的要退版：先讓 Hosting／函式退回舊 commit，
  # 確認函式不再依賴新 schema 之後，才動 db。
  #
  # environment: production —— 這是維護者的裁示（2026-09-21，見 docs/DECISIONS.md）：
  # 自動部署可以做，但「誰能讀到 Supabase 的 access token／DB 密碼」要收斂到
  # 「誰能把東西合進 main」，不能是「誰能對這個 repo 開一個 PR 分支」。單靠上面的
  # `if: github.ref == 'refs/heads/main'` 不夠——那只決定這個 job 跑不跑，repo 層級
  # 的 secret 在 pull_request workflow 裡一樣讀得到,改一行 workflow 就能在 PR 分支
  # 把它印出來或拿去部署。宣告 environment 之後，只有宣告了同一個 environment 的 job
  # 才能讀到「加在那個 environment 底下」的 secret，而且 GitHub 會先檢查目前這個 ref
  # 符不符合該 environment 的 deployment branch policy——不符合的話 job 連跑都不會跑,
  # 不用等到讀 secret 那一步才擋。
  #
  # 前提：SUPABASE_ACCESS_TOKEN 要加在 GitHub 的
  # Settings → Environments → production → Environment secrets 底下,不是加在
  # repo 層級的 Settings → Secrets and variables → Actions（加在那裡的話任何 job
  # 不管有沒有宣告 environment 都讀得到,等於沒設）。這個 environment 本身也要先建：
  # Deployment branches and tags 選 Selected branches and tags、只加 `main`；
  # 不要加 required reviewers（維護者要的是全程機器裁定，不是人工核准關卡）。
  # 2026-09-24 起不再一律等 Hosting：只有這次改了 public/skill.md 才需要「文件先上線、端點後上線」，
  # 那種情況由下面「等協議文件上線」那一步輪詢線上版號；沒改協議就跟 Hosting 同時部署。
  deploy-functions:
    name: 部署 Supabase（migrations ＋ Edge Functions）
    # 只有後端類 push 才跑（前端類 push 不動 migration 與函式；上次沒部署成功的後端改動由 changes 的 tag 基準算進後端類）。
    needs: [changes, typecheck, edge-tests, frontend-tests]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.changes.result == 'success' && needs.changes.outputs.backend == 'true' &&
      needs.typecheck.result == 'success' && needs.edge-tests.result == 'success' &&
      needs.frontend-tests.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    # 要在最後移動 edge-functions-deployed 這個 tag，需要 contents: write。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 要跟「上次成功部署」的 tag 做 diff，必須有完整歷史跟所有 tag，
          # 不能用預設的 shallow clone。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # SUPABASE_ACCESS_TOKEN 是 supabase.com/dashboard/account/tokens 生成的 CLI 管理權杖，
      # 跟 anon／service_role key 是不同東西。**不需要資料庫密碼**：CLI 用管理權杖就能 link 與
      # db push（2026-09-23 在乾淨目錄模擬 CI 實測：link 成功、db push --dry-run 回 up to date）。
      # 專案代號是公開的（每個端點網址裡都有），直接寫在下面，不必再放 secret。
      # 下面用「是不是空字串」判斷，不會把值印出來；缺就先擋下來講清楚，不讓 CLI 吐看不懂的認證錯誤。
      - name: 檢查部署憑證存在
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            {
              echo "## Edge Functions 沒有部署"
              echo
              echo "Hosting 已經是新版，但缺少 repo secret：$missing"
              echo
              echo "現在線上是「新前端配舊（或半新）端點」的狀態，跟這次自動化要擋的事故一樣。"
              echo "補上 secret 之後，下一次 push 到 main 會自動接著部署，不用重跑這次。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::缺少 repo secret：$missing（見上面的 job summary）"
            exit 1
          fi

      # 上次成功部署到哪個 commit，記在 edge-functions-deployed 這個 tag 上（見檔尾
      # 「標記部署成功」那一步）。找不到 tag 就是還沒跑過這套自動化，全部函式都當作
      # 受影響——之後每次 push 只重部真的被動到的那幾支，見 scripts/affected-functions.mjs。
      - name: 算出這次要部署哪些函式
        id: affected
        run: |
          BASE=$(git rev-parse -q --verify refs/tags/edge-functions-deployed || true)
          if [ -z "$BASE" ]; then
            echo "找不到 edge-functions-deployed tag，第一次跑，全部函式都重部一次。"
          else
            echo "上次成功部署：$BASE"
          fi
          FNS=$(node scripts/affected-functions.mjs "$BASE" "${{ github.sha }}" | tr '\n' ' ' | sed 's/ *$//')
          echo "受影響的函式：${FNS:-（沒有）}"
          echo "list=$FNS" >> "$GITHUB_OUTPUT"

      # 這次有改協議文件：等線上 skill.md 的版號追上程式的 PROTOCOL_VERSION 才部署函式
      # （端點領先文件會讓代理無限重讀，見上面說明）。沒改就直接過。最多等 25 分鐘。
      - name: 等協議文件上線（只在改了 skill.md 時）
        run: |
          BASE=$(git rev-parse -q --verify refs/tags/edge-functions-deployed || true)
          if [ -n "$BASE" ] && git diff --quiet "$BASE" "${{ github.sha }}" -- public/skill.md; then
            echo "這次沒改協議文件，不用等 Hosting。"; exit 0
          fi
          WANT=$(grep -o 'PROTOCOL_VERSION = "[0-9.]*"' supabase/functions/_shared/protocol.ts | grep -o '[0-9][0-9.]*')
          echo "程式的協議版本：$WANT，等線上 skill.md 追上"
          for i in $(seq 1 50); do
            LIVE=$(curl -fsS -m 20 "https://policy-tw.web.app/skill.md?ci=${{ github.sha }}" | grep -o '版本\*\*：[0-9.]*' | grep -o '[0-9][0-9.]*' || true)
            echo "第 $i 次：線上 $LIVE"
            [ "$LIVE" = "$WANT" ] && exit 0
            sleep 30
          done
          echo "::error::等了 25 分鐘，線上 skill.md 還不是 $WANT（Hosting 部署失敗？）。不部署函式，免得端點領先文件。"
          exit 1

      - name: 連結 Supabase 專案並套用 migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: wiiqoaytpqvegtknlbue
        run: |
          npx supabase link --project-ref "$PROJECT_REF"
          npx supabase db push --linked

      # 重用 scripts/deploy-functions.mjs，不要在這裡另外寫一份部署邏輯：
      # 它原本就會在部署前比對線上 skill.md 版號跟 PROTOCOL_VERSION，這裡當多一層
      # 斷言（見這個 job 開頭的說明），失敗就代表 Hosting 部署的東西跟這次 commit
      # 對不上，不應該硬部署，交給人來看。
      - name: 部署受影響的 Edge Functions
        if: steps.affected.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AFFECTED_FUNCTIONS: ${{ steps.affected.outputs.list }}
        run: node scripts/deploy-functions.mjs $AFFECTED_FUNCTIONS

      # 只有前面全部成功才移動這個 tag。失敗的話 tag 留在原地不動，下一次成功的
      # 部署會自動把這次漏掉的也一起算進去重部——不需要人手動介入去修「基準點」。
      - name: 標記這個 commit 部署成功
        if: success()
        run: |
          git tag -f edge-functions-deployed "${{ github.sha }}"
          git push origin -f edge-functions-deployed
